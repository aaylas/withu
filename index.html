<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aylan</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d60000; /* fundo vermelho */
      font-family: Arial, sans-serif;
    }

    /* Coração branco */
    .heart {
      position: relative;
      width: 120px;
      height: 120px;
      background: white;
      transform: rotate(-45deg);
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 50%;
    }
    .heart::before { top: -60px; left: 0; }
    .heart::after  { top: 0; left: 60px; }

    /* Mensagem em branco */
    .message {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font-size: 2.2rem;
      font-weight: bold;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    body.active .message { opacity: 1; }
    body.active .heart { opacity: 0; pointer-events: none; } /* coração desaparece */
  </style>
</head>
<body>
  <div class="heart" id="heart" role="button" tabindex="0" aria-label="Coração branco"></div>

  <div class="message">Te adoro, Alinho :) &lt;3</div>

    const heart = document.getElementById('heart');
    const activate = () => document.body.classList.add('active');

    heart.addEventListener('click', activate);
